name: Release Build

on:
  push:
    tags:
      - "v*.*.*"  # 推送 v1.0.0 之类的 tag 时触发

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux
          - platform: ubuntu-latest
            artifact_name: linux
            bundle_type: deb
          # Windows
          - platform: windows-latest
            artifact_name: windows
            bundle_type: msi
          # macOS
          - platform: macos-latest
            artifact_name: macos
            bundle_type: dmg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ==================== Linux 依赖 ====================
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev

      # ==================== Windows 依赖 ====================
      - name: Install MSVC build tools (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # Windows 上需要 Visual Studio Build Tools 和 WebView2
          # 通常 GitHub Actions 的 windows-latest 已经预装
          echo "If build fails, ensure WebView2 Runtime is installed."
          winget install Microsoft.VisualStudio.2022.BuildTools --override "--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" || true

      # ==================== macOS 依赖 ====================
      - name: Install Xcode tools (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          xcode-select --install 2>/dev/null || true
          brew install wget

      # ==================== 构建 ====================
      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle_type }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ==================== 上传产物 ====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*.${{ matrix.bundle_type }}
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
          # 保留 7 天，方便下载
          retention-days: 7
          # 如果路径没匹配到文件不报错（防止个别平台产物缺失导致工作流失败）
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded artifacts
        run: ls -R artifacts

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/desktop-agent-linux/*.deb
            artifacts/desktop-agent-windows/*.msi
            artifacts/desktop-agent-macos/*.dmg
          body: |
            ## What's new
            
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
            
            ## Assets
            
            - **Linux**: `.deb` installer (also available as `.AppImage` directly from artifacts)
            - **Windows**: `.msi` installer
            - **macOS**: `.dmg` installer
