name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: linux
            bundle_type: deb
          - platform: windows-latest
            artifact_name: windows
            bundle_type: msi
          - platform: macos-latest
            artifact_name: macos
            bundle_type: dmg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ==================== Linux 依赖 ====================
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libssl-dev \
            libudev-dev

      # ==================== Windows 依赖 ====================
      # windows-latest 已预装 MSVC Build Tools 和 WebView2，无需额外安装

      # ==================== macOS 依赖 ====================
      # macos-latest 已预装 Xcode 和 brew，无需额外安装

      # ==================== 构建 ====================
      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle_type }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ==================== 上传产物 ====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/desktop-agent-linux/*.deb
            artifacts/desktop-agent-windows/*.msi
            artifacts/desktop-agent-macos/*.dmg
          body: |
            ## Desktop Agent v${{ github.ref_name }}

            桌面端 AI Agent 应用，支持：
            - 🎙️ 实时语音交互（录音识别 + TTS 合成）
            - 🖼️ 识图 / 生图（阶跃星辰 API）
            - 🧠 本地记忆系统（思维导图可视化）
            - 🔧 技能包扩展 + 子 Agent
            - 🐳 Docker 沙箱环境
            - 🎨 自定义主题 / 字体 / 开机动画
            - 🛡️ 安全模式 / 完全模式

            ## Assets

            - **Linux**: `.deb` installer
            - **Windows**: `.msi` installer
            - **macOS**: `.dmg` installer
