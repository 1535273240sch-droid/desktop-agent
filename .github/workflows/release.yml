name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: linux
          - platform: windows-latest
            artifact_name: windows
          - platform: macos-latest
            artifact_name: macos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ==================== Linux 依赖 ====================
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev

      # ==================== 构建 ====================
      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ==================== 列出构建产物 ====================
      - name: List build artifacts
        run: find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle directory"

      # ==================== 上传产物 ====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/**
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Generate latest.json for auto-update
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Desktop Agent ${VERSION} - 桌面端 AI Agent 应用",
            "pub_date": "${DATE}",
            "platforms": {}
          }
          EOF

          # Linux
          if ls artifacts/desktop-agent-linux/*.deb 1>/dev/null 2>&1; then
            echo "Found Linux .deb"
          fi
          if ls artifacts/desktop-agent-linux/*.AppImage 1>/dev/null 2>&1; then
            echo "Found Linux .AppImage"
          fi

          # Windows
          if ls artifacts/desktop-agent-windows/*.msi 1>/dev/null 2>&1; then
            echo "Found Windows .msi"
          fi
          if ls artifacts/desktop-agent-windows/*.msix 1>/dev/null 2>&1; then
            echo "Found Windows .msix"
          fi
          if ls artifacts/desktop-agent-windows/*.exe 1>/dev/null 2>&1; then
            echo "Found Windows .exe"
          fi

          # macOS
          if ls artifacts/desktop-agent-macos/*.dmg 1>/dev/null 2>&1; then
            echo "Found macOS .dmg"
          fi
          if ls artifacts/desktop-agent-macos/*.app 1>/dev/null 2>&1; then
            echo "Found macOS .app"
          fi

      - name: Upload all artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            artifacts/desktop-agent-linux/**/*.deb
            artifacts/desktop-agent-linux/**/*.AppImage
            artifacts/desktop-agent-linux/**/*.sig
            artifacts/desktop-agent-windows/**/*.msi
            artifacts/desktop-agent-windows/**/*.msix
            artifacts/desktop-agent-windows/**/*.exe
            artifacts/desktop-agent-windows/**/*.sig
            artifacts/desktop-agent-macos/**/*.dmg
            artifacts/desktop-agent-macos/**/*.app
            artifacts/desktop-agent-macos/**/*.sig
          body: |
            ## Desktop Agent ${{ github.ref_name }}

            桌面端 AI Agent 应用，支持：
            - 🎙️ 实时语音交互（录音识别 + TTS 合成）
            - 🖼️ 识图 / 生图（阶跃星辰 API）
            - 🧠 本地记忆系统（思维导图可视化）
            - 🔧 技能包扩展 + 子 Agent
            - 🐳 Docker 沙箱环境
            - 🎨 自定义主题 / 字体 / 开机动画
            - 🛡️ 安全模式 / 完全模式

            ## 更新说明
            应用启动后会自动检查更新，发现新版本时会提示下载安装。

            ## Assets
            请根据你的操作系统选择对应的安装包下载。

      - name: Create "latest" tag for update endpoint
        uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          force_delete: true
          message: "Latest release - ${{ github.ref_name }}"
