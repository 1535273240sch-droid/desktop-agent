name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: linux
            bundle_type: deb
          - platform: windows-latest
            artifact_name: windows
            bundle_type: msi
          - platform: macos-latest
            artifact_name: macos
            bundle_type: dmg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle_type }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== Build output ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle directory"
          echo "=== Done ==="

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/
            src-tauri/target/release/bundle/msi/
            src-tauri/target/release/bundle/dmg/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Generate latest.json for auto-update
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Desktop Agent ${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {}
          }
          EOF

      - name: Upload all artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            artifacts/desktop-agent-linux/deb/*.deb
            artifacts/desktop-agent-windows/msi/*.msi
            artifacts/desktop-agent-macos/dmg/*.dmg
          body: |
            ## Desktop Agent ${{ github.ref_name }}

            桌面端 AI Agent 应用。请根据操作系统选择安装包。

            - **Linux**: `.deb`
            - **Windows**: `.msi`
            - **macOS**: `.dmg`

      - name: Create "latest" tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          force_delete: true
          message: "Latest release - ${{ github.ref_name }}"
