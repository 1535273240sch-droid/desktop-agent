name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_name: linux
            bundle_type: deb
          - platform: windows-latest
            artifact_name: windows
            bundle_type: msi
          - platform: macos-latest
            artifact_name: macos
            bundle_type: dmg

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ==================== Linux 依赖 ====================
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev

      # ==================== 构建 ====================
      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundle_type }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # ==================== 上传产物 ====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/app/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.json
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Generate latest.json for auto-update
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Desktop Agent ${VERSION} - 桌面端 AI Agent 应用",
            "pub_date": "${DATE}",
            "platforms": {}
          }
          EOF

          # 为每个平台添加下载链接
          if ls artifacts/desktop-agent-linux/*.deb 1>/dev/null 2>&1; then
            echo "Adding linux-x86_64..."
            LINUX_FILE=$(ls artifacts/desktop-agent-linux/*.deb | head -1)
            LINUX_URL="${LINUX_FILE#artifacts/desktop-agent-linux/}"
            # 尝试查找签名文件
            LINUX_SIG=""
            if ls artifacts/desktop-agent-linux/*.deb.sig 1>/dev/null 2>&1; then
              LINUX_SIG=$(cat artifacts/desktop-agent-linux/*.deb.sig)
            fi
          fi

          if ls artifacts/desktop-agent-windows/*.msi 1>/dev/null 2>&1; then
            echo "Adding windows-x86_64..."
            WIN_FILE=$(ls artifacts/desktop-agent-windows/*.msi | head -1)
            WIN_URL="${WIN_FILE#artifacts/desktop-agent-windows/}"
            WIN_SIG=""
            if ls artifacts/desktop-agent-windows/*.msi.sig 1>/dev/null 2>&1; then
              WIN_SIG=$(cat artifacts/desktop-agent-windows/*.msi.sig)
            fi
          fi

          if ls artifacts/desktop-agent-macos/*.dmg 1>/dev/null 2>&1; then
            echo "Adding darwin-x86_64..."
            MAC_FILE=$(ls artifacts/desktop-agent-macos/*.dmg | head -1)
            MAC_URL="${MAC_FILE#artifacts/desktop-agent-macos/}"
            MAC_SIG=""
            if ls artifacts/desktop-agent-macos/*.dmg.sig 1>/dev/null 2>&1; then
              MAC_SIG=$(cat artifacts/desktop-agent-macos/*.dmg.sig)
            fi
          fi

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            artifacts/desktop-agent-linux/*.deb
            artifacts/desktop-agent-windows/*.msi
            artifacts/desktop-agent-macos/*.dmg
            artifacts/desktop-agent-linux/*.sig
            artifacts/desktop-agent-windows/*.sig
            artifacts/desktop-agent-macos/*.sig
          body: |
            ## Desktop Agent ${{ github.ref_name }}

            桌面端 AI Agent 应用，支持：
            - 🎙️ 实时语音交互（录音识别 + TTS 合成）
            - 🖼️ 识图 / 生图（阶跃星辰 API）
            - 🧠 本地记忆系统（思维导图可视化）
            - 🔧 技能包扩展 + 子 Agent
            - 🐳 Docker 沙箱环境
            - 🎨 自定义主题 / 字体 / 开机动画
            - 🛡️ 安全模式 / 完全模式

            ## 更新说明
            应用启动后会自动检查更新，发现新版本时会提示下载安装。

            ## Assets

            - **Linux**: `.deb` installer
            - **Windows**: `.msi` installer
            - **macOS**: `.dmg` installer

      - name: Create "latest" tag for update endpoint
        uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          force_delete: true
          message: "Latest release - ${{ github.ref_name }}"
